<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Chance for Loose Change: the shop page</title>
<meta name="description" content="A dingy, overpriced hat shop from Welcome, Crawler, with every animation explained in MOTION-LOG.md.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body class="shop-page">
<!-- The same store as the game's window, as a page of its own. shop.js and item-art.js are shared with the game (index.html).
     Coins and the bag here are a demo: nothing carries over into the game. -->
<main id="storeDialog" class="standalone" aria-labelledby="storeTitle" aria-describedby="storeDesc">
  <header class="store-hero">
    <div id="storeArt" class="storefront"></div>
    <div>
      <h1 id="storeTitle">First Chance for Loose Change</h1>
      <p id="storeTag">Hats, mostly. Prices are not negotiable.</p>
      <button id="storePause" class="ghost pausebtn" type="button">Pause animations</button>
    </div>
  </header>
  <p id="demoNote">Demo page: you start with 40 coins, and anything you buy stays on this page. In the game, you earn coins from bugs and piñata llamas.</p>
  <p id="storeDesc">Coins: <span id="storeCoins">0</span>. Add items to the cart, then press Buy.</p>
  <div class="tryon" aria-hidden="true">
    <div id="tryonArt" class="tryon-art"></div>
    <span id="tryonName" class="tryon-text"></span>
    <span class="cartpill"><span id="cartBadge" class="badge">0</span><span>in cart</span></span>
  </div>
  <div id="storeItems"></div>
  <noscript>
    <p>The cart needs JavaScript. Without it, this is the stock:</p>
    <ul>
    <li><strong>Party hat for Donut</strong>, 4 coins. A small purple party hat for Donut. She will pretend not to like it.</li>
    <li><strong>Pirate hat for Donut</strong>, 8 coins. A black pirate hat with gold trim and a skull and crossbones, sized for a cat.</li>
    <li><strong>Umbrella hat for Donut</strong>, 6 coins. A hat with a small red and yellow umbrella on top, sized for a cat.</li>
    <li><strong>Baseball cap for Donut</strong>, 5 coins. A blue baseball cap with a curved brim, sized for a cat.</li>
    <li><strong>Cowboy hat for Donut</strong>, 8 coins. A tan cowboy hat with a wide curled brim, sized for a cat.</li>
    <li><strong>Pickle hat for Donut</strong>, 6 coins. A hat shaped like a green pickle, covered in little bumps, sized for a cat.</li>
    <li><strong>Tall striped hat for Donut</strong>, 9 coins. A very tall hat with red and white stripes, sized for a cat. It sticks well above her head.</li>
    <li><strong>Confetti grenade case</strong>, 5 coins. An empty case. Walk through fresh llama confetti to fill it. A full case is a grenade.</li>
    <li><strong>Confetti-proof nail file</strong>, 5 coins. Confetti no longer slows you down.</li>
    </ul>
  </noscript>
  <h2 id="cartHead">Cart</h2>
  <ul id="cartLines" aria-labelledby="cartHead"></ul>
  <p id="cartTotal"></p>
  <div class="row"><button id="storeBuy" type="button">Buy</button><button id="storeEmpty" class="ghost" type="button">Empty cart</button></div>
  <p id="storeNote" role="status"></p>
  <a class="linkbtn" id="storeLeave" href="index.html">Back to the dungeon</a>
</main>
<script type="module">
import { createShop } from './shop.js';
const $ = id => document.getElementById(id);
const state = { coins: 40, cart: {}, bought: 0, windowShopped: false };
const MAX = { caseEmpty: 3 }, bag = {};                                   // the game's limits: three cases, one of everything else
const invRoom = id => Math.max(0, (MAX[id] || 1) - (bag[id] || 0));
const invGive = (id, n = 1) => { bag[id] = (bag[id] || 0) + Math.min(n, invRoom(id)); };
createShop({ state, $, storeDlg: $('storeDialog'), invRoom, invGive, leaveHref: 'index.html' }).openStore();
</script>
</body>
</html>
